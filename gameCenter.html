<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Custom styles for the game */
      body {
        font-family: "Inter", sans-serif;
        background-color: #0f172a; /* slate-900 */
      }
      .game-card {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .game-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1),
          0 8px 10px -6px rgb(0 0 0 / 0.1);
      }
      #game-overlay {
        display: none; /* Initially hidden */
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(15, 23, 42, 0.95);
        z-index: 100;
        overflow-y: auto; /* Allow scrolling on the overlay for small screens */
      }
      #game-frame {
        border: 3px solid #06b6d4; /* cyan-500 */
        background-color: #1e293b; /* slate-800 */
      }
    </style>
  </head>
  <body class="text-white">
    <!-- Game Center Page -->
    <div id="game-center">
      <div class="p-4 sm:p-8">
        <header class="text-center mb-12">
          <h1
            class="text-5xl md:text-6xl font-black text-cyan-400 tracking-tight"
          >
            Game Center
          </h1>
          <p class="text-slate-400 mt-4 text-lg max-w-2xl mx-auto">
            A collection of simple browser games. Select a game to play.
          </p>
        </header>
        <main>
          <div
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-6xl mx-auto"
          >
            <!-- Snake Game Card -->
            <div
              class="game-card bg-slate-800 rounded-2xl shadow-lg overflow-hidden"
            >
              <div
                class="h-48 flex items-center justify-center bg-slate-700 text-cyan-400 p-4"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="80"
                  height="80"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 12H12.01" />
                  <path d="M16 6H16.01" />
                  <path d="M12 18H12.01" />
                  <path d="M18 12H18.01" />
                  <path d="M6 12H6.01" />
                  <path d="M19 19L21 21" />
                  <path d="M10 4L4 10" />
                  <path d="M4 4L10 10" />
                </svg>
              </div>
              <div class="p-6">
                <h3 class="text-2xl font-bold text-white mb-2">
                  Classic Snake
                </h3>
                <p class="text-slate-400 mb-6 h-20">
                  A timeless classic. Guide the snake to eat the food, but don't
                  run into yourself!
                </p>
                <button
                  onclick="showGame('games/snake.html')"
                  class="w-full bg-cyan-500 text-slate-900 font-bold py-3 px-4 rounded-lg hover:bg-cyan-400 transition-colors duration-300 flex items-center justify-center"
                >
                  Play Game
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="ml-2 h-5 w-5"
                  >
                    <polyline points="13 17 18 12 13 7"></polyline>
                    <polyline points="6 17 11 12 6 7"></polyline>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Snake Showdown Card -->
            <div
              class="game-card bg-slate-800 rounded-2xl shadow-lg overflow-hidden"
            >
              <div
                class="h-48 flex items-center justify-center bg-slate-700 text-cyan-400 p-4"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="80"
                  height="80"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 12H12.01" />
                  <path d="M16 6H16.01" />
                  <path d="M12 18H12.01" />
                  <path d="M18 12H18.01" />
                  <path d="M6 12H6.01" />
                  <path d="M19 19L21 21" />
                  <path d="M10 4L4 10" />
                  <path d="M4 4L10 10" />
                </svg>
              </div>
              <div class="p-6">
                <h3 class="text-2xl font-bold text-white mb-2">
                  Snake Showdown
                </h3>
                <p class="text-slate-400 mb-6 h-20">
                  Two snakes enter. One snake leaves.
                </p>
                <button
                  onclick="showGame('games/snakeShowdown.html')"
                  class="w-full bg-cyan-500 text-slate-900 font-bold py-3 px-4 rounded-lg hover:bg-cyan-400 transition-colors duration-300 flex items-center justify-center"
                >
                  Play Game
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="ml-2 h-5 w-5"
                  >
                    <polyline points="13 17 18 12 13 7"></polyline>
                    <polyline points="6 17 11 12 6 7"></polyline>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Placeholder for a new game -->
            <div
              class="flex items-center justify-center border-2 border-dashed border-slate-700 rounded-2xl p-8 text-slate-500 min-h-[350px]"
            >
              <p>More games coming soon...</p>
            </div>
          </div>
        </main>
        <footer class="text-center mt-16 text-slate-500">
          <p>&copy; 2025 Kartik Singh. All rights reserved.</p>
        </footer>
      </div>
    </div>

    <!-- Game Container using an IFrame -->
    <div id="game-overlay">
      <div class="w-full h-full flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-2xl text-center mb-4">
          <div class="flex justify-between items-center mb-4">
            <button
              onclick="hideGame()"
              class="bg-slate-700 text-white font-bold py-2 px-4 rounded-lg hover:bg-slate-600 transition-colors duration-300 flex items-center"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="mr-2 h-5 w-5"
              >
                <path d="m12 19-7-7 7-7" />
                <path d="M19 12H5" />
              </svg>
              Back to Game Center
            </button>
          </div>
        </div>
        <iframe
          id="game-frame"
          class="w-full max-w-2xl h-[650px]"
          src=""
        ></iframe>
      </div>
    </div>

    <script>
      // --- Page Navigation ---
      const gameCenter = document.getElementById("game-center");
      const gameOverlay = document.getElementById("game-overlay");
      const gameFrame = document.getElementById("game-frame");

      function showGame(gameUrl) {
        gameCenter.style.display = "none";
        gameOverlay.style.display = "flex";
        gameFrame.src = gameUrl; // Load the specified game file
      }

      function hideGame() {
        gameCenter.style.display = "block";
        gameOverlay.style.display = "none";
        gameFrame.src = ""; // Unload the iframe content to stop the game
      }
    </script>
  </body>
</html>
